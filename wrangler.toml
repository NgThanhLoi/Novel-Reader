# wrangler.toml
# Cấu hình Cloudflare Pages / Workers Full-Stack
name = "novel-reader-app"
compatibility_date = "2024-09-01"
pages_build_output_dir = "dist"

# 1. Cloudflare D1 Database Binding
# Tạo database bằng lệnh: npx wrangler d1 create novel-library-d1
# Sau đó thay database_id bên dưới:
[[d1_databases]]
binding = "DB"
database_name = "novel-library-d1"
database_id = "410c4b7a-9f71-489b-a0a6-325669ff8745"

# 2. Cloudflare Workers KV Binding (Bộ nhớ đệm siêu tốc cho chương & danh mục)
# Tạo KV bằng lệnh: npx wrangler kv:namespace create NOVEL_CACHE
[[kv_namespaces]]
binding = "NOVEL_CACHE"
id = "33a6ffc9b97947f0873ed2e70ce56de9"

# 3. Backblaze B2 file store (qua S3-compatible API, xem functions/api/files/[[path]].ts)
# Secrets (không commit): npx wrangler pages secret put B2_KEY_ID / B2_APP_KEY --project-name=novel-reader-app
[vars]
B2_BUCKET = "novel-reader"
B2_ENDPOINT = "https://s3.us-east-005.backblazeb2.com"
